<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trakey Pro</title>
<style>
  :root{--bg:#0b0f14;--card:#121a24;--text:#eaf1f8;--sub:#8fa1b3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{width:min(92vw,420px);background:var(--card);border-radius:28px;padding:28px 24px}
  h1{margin:0 0 8px;font-size:22px}
  p{color:var(--sub);margin:6px 0;line-height:1.5;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Trakey Pro</h1>
  <p>Payments now happen inside the Trakey app. Update Trakey to the latest version, open Settings &gt; Trakey Pro and tap Continue.</p>
</main>
</body>
</html>
