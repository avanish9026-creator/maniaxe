<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trakey Web | Maniaxe</title>
<meta name="description" content="Trakey Web by Maniaxe: view and manage your Trakey notes, tasks, goals, habits and exams on a bigger screen.">
<link rel="icon" type="image/png" href="../assets/trakey-logo.png">
<link rel="apple-touch-icon" href="../assets/trakey-logo.png">
<meta name="theme-color" content="#0a0d12">
<style>
:root{--bg:#f3f7fb;--card:#fff;--elev:#e9f0f7;--text:#13202c;--sub:#5d6f80;--blue:#3aa8ff;--line:#dbe5ee;--ok:#2fb37a;--bad:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#0a0d12;--card:#141a22;--elev:#1d2630;--text:#eef3f8;--sub:#8fa1b3;--line:#26313d}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#login h1{margin:0;font-size:34px}#login p{margin:0;color:var(--sub);max-width:420px}
.btn{background:var(--blue);color:#06121c;border:0;border-radius:999px;padding:12px 26px;font-weight:700}
.btn.ghost{background:var(--elev);color:var(--text)}
#err{color:var(--bad);max-width:460px;font-size:14px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav .brand{font-weight:800;font-size:20px;padding:4px 12px 14px}

nav a span{font-weight:500;font-size:13px}
nav .foot{margin-top:auto;font-size:12px;color:var(--sub);padding:12px}
main{padding:26px clamp(16px,4vw,44px);max-width:1100px;width:100%}
h2{margin:0 0 4px;font-size:26px}.sub{color:var(--sub);margin:0 0 20px;font-size:14px}
.banner{background:color-mix(in srgb,var(--blue) 12%,transparent);border:1px solid color-mix(in srgb,var(--blue) 35%,transparent);border-radius:14px;padding:10px 14px;margin-bottom:20px;font-size:13px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-size:34px;line-height:1.1}.stat span{color:var(--sub);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
.t{font-weight:650;overflow-wrap:anywhere}.m{color:var(--sub);font-size:13px}
.chip{display:inline-block;background:var(--elev);border-radius:999px;padding:4px 12px;font-size:13px;margin:0 6px 6px 0;border:0;color:var(--text)}
.chip.on{background:var(--blue);color:#06121c;font-weight:700}
.bar{height:6px;background:var(--elev);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--blue)}
input[type=search]{width:100%;max-width:420px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);margin-bottom:14px;font:inherit}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--sub);flex:none;padding:0;cursor:pointer}.dot.ok{background:var(--blue);border-color:var(--blue)}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--elev);color:var(--sub)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}summary{cursor:pointer;font-weight:650}
.opt{padding:3px 0;font-size:14px;color:var(--sub)}.opt.right{color:var(--ok);font-weight:700}.opt.wrong{color:var(--bad);font-weight:700}
.empty{color:var(--sub);padding:30px 0;text-align:center}
@media(max-width:760px){#app{display:block}nav{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:5;border-right:0;border-bottom:1px solid var(--line)}nav .brand,nav .foot{display:none}nav a{white-space:nowrap;gap:6px}nav a span{display:none}main{padding:18px 14px}}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.mini{background:var(--elev);color:var(--text);border:0;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.mini.danger{color:var(--bad)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 14px}
dialog label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
dialog input[type=text],dialog input[type=date],dialog textarea{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
dialog textarea{min-height:160px;resize:vertical}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;text-align:center;padding:10px 0;border-radius:999px;background:var(--elev);color:var(--text);cursor:pointer;font-weight:600}
.seg input{display:none}.seg input:checked+span{color:var(--blue)}.seg label:has(input:checked){background:var(--blue);color:#06121c}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--text)!important;font-size:14px!important}
.livepill{font-size:12px;color:var(--ok)}
.exfolder.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--card))}.exfolder.off{opacity:.5}
.exck{width:46px;height:46px;border-radius:50%;border:0;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-size:18px;font-weight:700;flex:none}
.exck.on{background:var(--blue);color:#06121c}
.exsw{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;cursor:pointer;font-weight:600}
.exsw input{width:20px;height:20px;accent-color:var(--blue)}
.exnum{padding:0 4px 12px}.exnum input{width:120px;padding:9px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.segb{flex:1;border:0;border-radius:999px;padding:10px 0;background:var(--elev);color:var(--text);font-weight:600}.segb.on{background:var(--blue);color:#06121c}
.exmark{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.runner{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;overflow:auto}
.runner>*{width:min(760px,100%)}
.rtop{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.ricon{width:46px;height:46px;border-radius:50%;border:0;background:var(--elev);color:var(--text);font-size:16px;font-weight:700;flex:none}.ricon.bad{color:var(--bad)}

.rprog{display:flex;align-items:center;gap:12px;padding:0 22px}
.rbody{flex:1;padding:24px 22px;overflow:auto}.rq{font-size:24px;font-weight:650;line-height:1.35;overflow-wrap:anywhere;margin-bottom:24px}
.ropts{display:flex;flex-direction:column;gap:12px}
.ropt{display:flex;gap:14px;align-items:center;text-align:left;padding:16px 18px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px}

.ropt.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card))}.ropt.on b{background:var(--blue);color:#06121c}
.rfoot{display:flex;gap:12px;padding:14px 18px 22px;align-items:center}
.rplay{width:112px;height:112px;border-radius:50%;border:0;background:var(--blue);color:#06121c;font-size:44px}
.rsheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:5}
@media print{nav,.banner,.btnrow,.chip,.top .chip,#runner{display:none!important}#app{display:block}main{padding:0}}
.mxlink{display:inline-flex;align-items:center;gap:6px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:600}
.mxlink:hover{color:var(--blue)}
#login .mxlink{margin-top:10px}
nav .mxlink{padding:10px 12px;margin-top:4px}
@media(max-width:760px){nav .mxlink{display:none}}
.lrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;color:inherit}
.licon{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--blue) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.licon.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:800}
.lrowtop{display:flex;justify-content:space-between;gap:10px}.lrow .grow{display:flex;flex-direction:column}
.deck{max-width:720px}.deckbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.flash{width:100%;min-height:260px;border-radius:28px;border:1px solid var(--line);background:var(--card);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;text-align:center;cursor:pointer;font:inherit}
.flash:hover{border-color:var(--blue)}.ffront{font-size:28px;font-weight:750;overflow-wrap:anywhere}.fback{font-size:21px;color:var(--blue);font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}.fhint{font-size:13px;color:var(--sub)}
.lcard.got{background:color-mix(in srgb,var(--ok) 8%,var(--card))}
button:disabled{opacity:.45;cursor:default}
dialog select{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--elev);color:var(--text);border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:80;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.optbtn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--sub);padding:5px 8px;margin:1px 0;border-radius:10px;font-size:14px}.optbtn:hover{background:var(--elev);color:var(--text)}
.qopt{display:flex;align-items:center;gap:10px;margin-top:8px}.qopt input[type=radio]{width:20px;height:20px;accent-color:var(--blue);flex:none}.qopt input[type=text]{flex:1;width:auto}
dialog form:has(input[name=qtype][value=TRUE_FALSE]:checked) .qmcq{display:none}
dialog form:has(input[name=qtype][value=MCQ]:checked) .qtf{display:none}
dialog input[type=number]{width:120px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
dialog input[type=file]{width:100%;color:var(--sub);font:inherit}
.draftpill{color:#f2a93b}
#scandlg{width:min(640px,94vw);max-height:92vh;overflow:auto}
#scandlg h3{margin:0}
#scandlg .schead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}#scandlg .schead h3{flex:1}
dialog .ricon.sm{width:36px;height:36px;font-size:14px}
#scandlg .scsrc3{display:flex;gap:10px}
#scandlg .scsrc{flex:1;height:54px;border-radius:18px;background:var(--elev);color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;padding:0}
#scandlg .scsrc:hover{background:color-mix(in srgb,var(--blue) 16%,var(--elev))}
dialog .scthumbs{display:flex;gap:10px;overflow-x:auto;padding-top:14px}
dialog .scthumb{position:relative;flex:none;width:66px;height:88px;border-radius:14px;overflow:hidden;background:var(--elev)}
dialog .scthumb img{width:100%;height:100%;object-fit:cover;display:block}
dialog .scthumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(10,13,18,.78);color:#fff;font-size:11px;line-height:1;padding:0}
dialog .scthumb i{position:absolute;left:5px;bottom:5px;font-style:normal;font-size:11px;font-weight:700;background:rgba(10,13,18,.78);color:#fff;border-radius:8px;padding:1px 6px}
dialog .scfile{display:flex;align-items:center;gap:10px;background:var(--elev);border-radius:16px;padding:6px 8px 6px 12px;margin-top:14px}
dialog .scfile span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scandlg .scnotice{display:flex;gap:10px;background:var(--elev);border-radius:16px;padding:12px;margin-top:12px;font-size:12px;color:var(--sub);line-height:1.5}
#scandlg .scnotice svg{flex:none;color:var(--blue);margin-top:1px}#scandlg .scnotice b{color:var(--text)}
#scandlg .scseg{display:flex;gap:6px;background:var(--elev);border-radius:22px;padding:4px;margin-top:16px}
#scandlg .scseg button{flex:1;border:0;border-radius:18px;padding:10px 0;background:transparent;color:var(--text);font-weight:600}
#scandlg .scseg button.on{background:var(--blue);color:#06121c}
#scandlg .sclabel{display:block;margin:16px 0 4px;font-size:13px;color:var(--sub)}
#scandlg input[type=password],#scandlg input[type=text]{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
#scandlg .schint{font-size:12px;color:var(--sub);margin-top:6px}#scandlg .schint a{color:var(--blue)}
#scandlg .scgo{width:100%;padding:14px;margin-top:16px}
#scandlg .sccaution{display:flex;gap:6px;align-items:center;justify-content:center;font-size:11px;color:var(--sub);margin:14px 0 4px}
#scandlg .scrun{text-align:center;padding:14px 0 6px}
#scandlg .scring{--p:0;width:176px;height:176px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--elev) 0);display:flex;align-items:center;justify-content:center;position:relative;margin:6px auto 22px}
#scandlg .scring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--card)}
#scandlg .scring b{position:relative;font-size:38px}
#scandlg .scfound{color:var(--blue);font-weight:650;font-size:13px;min-height:20px;margin:6px 0 18px}
#scandlg .sclist{margin-top:10px}
#scandlg .sccard.off{opacity:.55}
#scandlg .sccard textarea{min-height:64px}
#scandlg .scflag{color:#f2a93b;font-size:12px;margin-top:6px}
#scandlg .sctopic{font-size:12px;font-weight:650;color:var(--blue)}
#scandlg::backdrop{background:rgba(0,0,0,.5)}
.dzhint{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12px;color:var(--sub);border:1.5px dashed var(--line);border-radius:16px;padding:10px 12px;margin-top:10px}
dialog.dragover{outline:2px dashed var(--blue);outline-offset:-8px}
dialog.dragover .dzhint{border-color:var(--blue);color:var(--blue)}
dialog .scsrc3{display:flex;gap:10px}
dialog .scsrc{flex:1;height:54px;border-radius:18px;background:var(--elev);color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;padding:0}
dialog .scsrc:hover{background:color-mix(in srgb,var(--blue) 16%,var(--elev))}
#dlg input[type=password]{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.probadge{display:inline-block;vertical-align:middle;margin-left:8px;border:0;border-radius:4px;padding:2px 6px;background:linear-gradient(90deg,#FFD166,#FFB347);color:#3A2600;font:800 9px/9px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.2px;cursor:pointer}
nav a.proNav{color:#b97800}nav a.proNav span{font-weight:700}
@media (prefers-color-scheme:dark){nav a.proNav{color:#FFD166}}
.uselimit{font-size:12px;color:var(--sub);margin:10px 0 0;line-height:1.5}
.uselimit.out{color:var(--text);background:var(--elev);border-radius:16px;padding:12px}
a.btn.scgo{display:block;text-align:center;text-decoration:none;box-sizing:border-box}
</style>
</head>
<body>

<section id="login">
  <h1>Trakey Web</h1>
  <p>See your notes, tasks, goals, habits, Learn and Challenge data on a bigger screen. Sign in with the same Google account you use in the Trakey app.</p>
  <button class="btn" id="signin">Sign in with Google</button>
  <div id="err"></div>
  <a class="mxlink" href="../app.html">← Back to Trakey app page</a>
</section>

<div id="app" class="hide">
  <nav id="nav"></nav>
  <main>
    <div class="banner" id="banner"></div>
    <div id="view"></div>
  </main>
</div>

<div id="runner" class="runner hide"></div>
<dialog id="dlg"><form method="dialog" id="dlgform"></form></dialog>
<dialog id="scandlg"></dialog>
<div id="toast" class="toast hide"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { ssoSignIn, clearHandoff } from "../js/sso.js";
// core.js is loaded after sign-in (see load), so the Sign-in button works even if core.js is missing.
let gunzip, decodePrefs, buildModel, unpackSync, packSync, normalizeFeature, toRaw;
let L = null;                                   // learn.js, loaded after sign-in
let Q = null, S = null;                         // qimport.js (question import) and scan.js (Scan with AI), loaded after sign-in
let P = null;                                   // pro.js (Trakey Pro status + free daily limits), loaded after sign-in
let PAY = null;                                 // pay.js (Trakey Pro page + UPI payment), loaded after sign-in
let proRaw = null, proUnsub = [], proRemote = { scan: 0, import: 0 };   // proStatus/{uid} and webUsage/{uid} as last read

/* ---- 1. PASTE YOUR FIREBASE WEB CONFIG HERE (Firebase console > Project settings > Your apps > Web app) ---- */
const firebaseConfig = {
  apiKey: "AIzaSyDjq71StPRBPhJ5Fplt1Bhe7D96An3V1lc",
  authDomain: "trakey-b6002.firebaseapp.com",
  projectId: "trakey-b6002",
  appId: "1:164803851209:web:9ecca1501b27e0afadee18"
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = (ms) => ms ? new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
const fmtDT = (ms) => ms ? new Date(ms).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;

if (firebaseConfig.apiKey.startsWith("PASTE")) {
  $("err").textContent = "Setup needed: open index.html and paste your Firebase web config at the top of the script.";
  $("signin").disabled = true;
}
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let X = null;                                   // exam.js, loaded after sign-in
let webExams = [];                              // exams taken on the website (users/{uid}/backup/web_exam_history)
let ex = { view: "setup", sel: [], topicSel: {}, openTopics: null, qLimit: false, qCount: 20, tLimit: false, minutes: 30, perQ: false, perQSec: 60, neg: false, negIdx: 1, shuffle: true, rec: null, filter: 0 };

if (location.protocol === "file:") {
  $("err").textContent = "Open this page through a web address (https://maniaxe.in/... or http://127.0.0.1:PORT), not by double-clicking the file. Google sign-in and the page scripts do not work from file://.";
  $("signin").disabled = true;
}

$("signin").onclick = async () => {
  const button = $("signin"), err = $("err");
  err.textContent = "";
  button.disabled = true;
  button.textContent = "Opening Google…";
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    console.error("Trakey Google sign-in error:", e);
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }

async function load(user) {
  $("view").innerHTML = '<div class="empty">Loading your backup…</div>';
  try {
    if (!gunzip) ({ gunzip, decodePrefs, buildModel, unpackSync, packSync, normalizeFeature, toRaw } = await import("./core.js"));
    if (!X) { try { X = await import("./exam.js"); } catch (e) { console.error("exam.js", e); } }
    if (!L) { try { L = await import("./learn.js"); } catch (e) { console.error("learn.js", e); } }
    if (!Q) { try { Q = await import("./qimport.js"); } catch (e) { console.error("qimport.js", e); } }
    if (!S) { try { S = await import("./scan.js"); } catch (e) { console.error("scan.js", e); } }
    if (!P) { try { P = await import("./pro.js"); } catch (e) { console.error("pro.js", e); } }
    if (!PAY && P) { try { PAY = await import("./pay.js"); } catch (e) { console.error("pay.js", e); } }
    if (PAY) PAY.initPay({ db, auth, P, getRaw: () => proRaw });
    proWatch(user);
    const main = await getDoc(doc(db, "users", user.uid, "backup", "main"));
    if (!main.exists()) { M = buildModel({}); M.base = { notes: [], tasks: [], learnNotes: [] }; backupMeta = null; attachLive(user); applyLive(); return; }
    const d = main.data();
    let prefs;
    if (d.format === "gzip-json") {
      const chunks = [];
      for (let i = 0; i < (d.parts || 0); i++) {
        const p = await getDoc(doc(db, "users", user.uid, "backup", "part_" + i));
        if (!p.exists()) throw new Error("The backup is incomplete (missing part " + i + ").");
        chunks.push(p.data().data.toUint8Array());
      }
      const all = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
      let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
      prefs = decodePrefs(JSON.parse(new TextDecoder().decode(await gunzip(all))));
    } else {
      prefs = decodePrefs(d.prefs || {});     // old schema 3 backups
    }
    M = buildModel(prefs);
    M.base = { notes: M.notes, tasks: M.tasks, learnNotes: M.learnNotes };
    backupMeta = { at: d.updatedAt?.toMillis?.() || 0, email: user.email };
  } catch (e) {
    M = null; backupMeta = null;
    const hint = gunzip ? "" : "<br><small>core.js could not be loaded. Upload core.js into the same folder as index.html.</small>";
    $("view").innerHTML = '<div class="empty">Could not load your data.<br><small>' + esc(e.code || e.message) + '</small>' + hint + '</div>';
    return;
  }
  attachLive(user);
  applyLive();
}

const FEATURES = ["notes", "goals", "tasks", "questions", "learn"];
const MODEL_KEY = { notes: "notes", goals: "goals", tasks: "tasks", questions: "folders", learn: "learnNotes" };

function attachLive(user) {
  if (live.uid === user.uid) return;
  live.unsub.forEach((f) => f());
  live = { uid: user.uid, unsub: [], docs: {}, seq: {} };
  liveError = "";
  for (const feature of FEATURES) {
    live.seq[feature] = 0;
    live.unsub.push(onSnapshot(doc(db, "users", user.uid, "backup", "sync_" + feature), async (snap) => {
      const n = ++live.seq[feature];
      let arr = null;
      try { arr = snap.exists() ? await unpackSync(snap.data().data) : null; } catch { arr = null; }
      if (n !== live.seq[feature]) return;           // a newer snapshot arrived meanwhile
      live.docs[feature] = arr;
      live.lastAt = Date.now();
      liveError = "";
      applyLive();
    }, (err) => { liveError = err.code || err.message; render(); }));
  }
  live.unsub.push(onSnapshot(doc(db, "users", user.uid, "backup", "web_exam_history"), async (snap) => {
    try { webExams = snap.exists() ? await unpackSync(snap.data().data) : []; } catch { webExams = []; }
    if (tab === "exam") render();
  }, () => {}));
}

/** Features the phone has synced replace the backup copy; others keep showing the backup. */
function applyLive() {
  if (M) for (const f of FEATURES) if (live.docs[f]) M[MODEL_KEY[f]] = normalizeFeature(f, live.docs[f]);
  render();
}

/** Change one synced list safely: read it, apply the change, write it back in one transaction. */
async function mutateSync(feature, change) {
  const ref = doc(db, "users", auth.currentUser.uid, "backup", "sync_" + feature);
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      const current = snap.exists() ? await unpackSync(snap.data().data) : toRaw(feature, M.base[MODEL_KEY[feature]] || []);
      const next = change(current);
      const packed = await packSync(next);
      if (packed.length > 900000) throw new Error("This list is too large to sync.");
      const prev = snap.exists() ? Number(snap.data().updatedAt || 0) : 0;
      tx.set(ref, { data: packed, updatedAt: Math.max(Date.now(), prev + 1), by: "web", count: next.length }, { merge: true });
    });
  } catch (e) { alert("Could not save: " + (e.code || e.message) + "\nCheck the Firestore rule in README.md."); }
}

function writeItem(kind, id, data) {
  return mutateSync(kind, (arr) => {
    const i = arr.findIndex((x) => String(x.id) === String(id));
    const obj = { ...(i >= 0 ? arr[i] : {}), ...data, id };
    if (i >= 0) arr[i] = obj; else arr.push(obj);
    return arr;
  });
}

function deleteItem(kind, id) {
  if (!confirm("Delete this " + ({ notes: "note", tasks: "task", learn: "card" }[kind] || "item") + "? It will also be removed from the app.")) return;
  return mutateSync(kind, (arr) => arr.filter((x) => String(x.id) !== String(id)));
}

async function saveExamHistory(change) {
  const ref = doc(db, "users", auth.currentUser.uid, "backup", "web_exam_history");
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      let next = change(snap.exists() ? await unpackSync(snap.data().data) : []).sort((a, b) => a.at - b.at).slice(-300);
      let packed = await packSync(next);
      while (packed.length > 850000 && next.length > 1) { next = next.slice(1); packed = await packSync(next); }
      tx.set(ref, { data: packed, updatedAt: Date.now(), by: "web", count: next.length }, { merge: true });
    });
  } catch (e) { alert("The exam result could not be saved to your account (" + (e.code || e.message) + "). It is shown here only."); }
}

function updateStartLabel() {
  const b = $("exstart"); if (!b) return;
  const n = examPool().length;
  b.textContent = "Start · " + (ex.qLimit ? Math.min(Math.max(1, ex.qCount || 1), n) : n);

function startExam() {
  ex.qCount = Math.max(1, ex.qCount | 0); ex.minutes = Math.max(1, ex.minutes | 0); ex.perQSec = Math.max(5, ex.perQSec | 0);
  const pool = examPool();
  if (!pool.length) return;
  const base = ex.shuffle ? X.shuffle(pool) : pool;
  const qs = ex.qLimit ? base.slice(0, ex.qCount) : base;
  const src = "u:" + ex.sel.slice().sort().join(",");
  const title = ex.sel.length === 1 ? (M.folders.find((f) => f.id === ex.sel[0])?.title || "Exam") : "Mixed exam";
  const last = examRecords().filter((r) => r.src === src).sort((a, b) => b.at - a.at)[0];
  const run = { title, questions: qs, perQ: ex.perQ ? ex.perQSec : 0, totalSec: ex.tLimit ? ex.minutes * 60 : 0,
    negative: ex.neg ? X.NEG_VALUES[ex.negIdx] : 0, allowPause: true, allowBack: !ex.perQ, src, prevPct: last ? X.view(last).scorePct : -1 };
  X.runExam(run, $("runner"), esc, (answers, seconds, early) => {
    const rec = X.buildRecord(run, answers, seconds, early);
    webExams = [...webExams, rec];
    ex.view = "result"; ex.rec = rec; ex.filter = 0;
    location.hash = "exam";
    render();
    saveExamHistory((list) => [...list, rec]);
  });
}

/** Add / edit a card. Subject = the one you are in (My notes from the Learn home), like the app's sheet. */
function learnDialog(note, opts = {}) {
  const subjects = learnSubjects();
  const sid = note ? note.sid : (ln.sid || L.NOTES_ID);
  const subject = subjects.find((s) => s.id === sid);
  const targets = L.targetsFor(subject);
  // keep a card's own topic selectable even if its subject list does not show it (so editing never moves it)
  if (note && !targets.some((t) => t.key === (note.tid || L.userKey(note.topic || "General")))) {
    targets.push({ key: note.tid || L.userKey(note.topic || "General"), label: note.tid || note.topic || "General", tid: note.tid || "", topic: note.topic || "" });
  }
  const topicNow = ln.tid ? subject?.topics.find((t) => t.id === ln.tid) : null;
  const selected = note ? (note.tid || L.userKey(note.topic || "General")) : (topicNow ? (topicNow.isNotes ? L.userKey(topicNow.title) : topicNow.id) : targets[0]?.key || "");
  const showSelect = targets.length > 0 && !opts.newTopic;
  const title = (note ? "Edit card" : opts.newTopic ? "New topic" : "New card") + (subject ? " · " + esc(subject.title) : "");
  openDialog(title, `
    ${showSelect ? `<label>Topic</label><select name="target">${targets.map((t) => `<option value="${esc(t.key)}" ${t.key === selected ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select>` : ""}
    <label>${showSelect ? "Or a new topic (optional)" : "Topic name"}</label><input type="text" name="newtopic" placeholder="${showSelect ? "Type a name to create a new topic" : "e.g. Rivers"}" ${opts.newTopic ? "autofocus" : ""}>
    <label>Front (question)</label><textarea name="front" style="min-height:70px" ${opts.newTopic || showSelect ? "" : "autofocus"}>${esc(note?.front)}</textarea>
    <label>Back (answer)</label><textarea name="back" style="min-height:110px">${esc(note?.back)}</textarea>`,
  (fd) => {
    if (!val(fd, "front") || !val(fd, "back")) { alert("Both the front and the back are needed."); return false; }
    if (opts.newTopic && !val(fd, "newtopic")) { alert("Type a name for the new topic."); return false; }
    const id = note?.id || "n_" + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "_" + Math.random().toString(16).slice(2));
    const n = L.noteFromForm({ id, sid, targets, selected: fd.get("target") || "", newTopic: fd.get("newtopic"), front: fd.get("front"), back: fd.get("back") });
    writeItem("learn", id, { topic: n.topic, front: n.front, back: n.back, sid: n.sid, tid: n.tid });
    ln.order = null; ln.idx = 0; ln.flipped = false;
  });
}

function startLearnPractice(topic, count) {
  if (!X) { alert("exam.js could not be loaded, so practice is not available."); return; }
  const qs = L.practiceQuestions(topic, count);

  const run = { title: topic.title, questions: qs, perQ: 0, totalSec: 0, negative: 0, allowPause: false, allowBack: true, src: "learn:" + topic.id, prevPct: -1 };

  openDialog("Practice · " + esc(topic.title), `<label>How many questions?</label>
    <div class="seg">${choices.map((n, i) => `<label><input type="radio" name="count" value="${n}" ${i === 0 ? "checked" : ""}><span>${n === total && choices.length > 1 ? "All " + n : n}</span></label>`).join("")}</div>`,
  (fd) => { const n = Number(fd.get("count")) || total; setTimeout(() => startLearnPractice(topic, n), 0); });

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-ln]");
  if (!b || !M || !L || tab !== "learn") return;
  e.preventDefault();
  const act = b.dataset.ln, subjects = learnSubjects();
  const subject = subjects.find((s) => s.id === ln.sid), topic = subject?.topics.find((t) => t.id === ln.tid);
  const reset = () => { ln.idx = 0; ln.flipped = false; ln.order = null; ln.result = null; };
  if (act === "home") { ln.sid = null; ln.tid = null; reset(); }
  else if (act === "subject") { ln.sid = b.dataset.sid; ln.tid = null; reset(); }
  else if (act === "open") {
    ui.q = ""; reset(); ln.sid = b.dataset.sid; ln.tid = b.dataset.tid || null;
    const t = subjects.find((s) => s.id === ln.sid)?.topics.find((x) => x.id === ln.tid);
    if (t) ln.mode = t.listView ? 1 : 0;
  }
  else if (act === "mode") { ln.mode = Number(b.dataset.mode); ln.idx = 0; ln.flipped = false; }
  else if (act === "flip") ln.flipped = !ln.flipped;
  else if (act === "next") { ln.idx++; ln.flipped = false; }
  else if (act === "prev") { ln.idx = Math.max(0, ln.idx - 1); ln.flipped = false; }
  else if (act === "shuffle" && topic) { ln.order = L.shuffle(topic.items.map((_, i) => i)); ln.idx = 0; ln.flipped = false; }
  else if (act === "scan") return openScan(ln.sid || "");
  else if (act === "add") return learnDialog(null);
  else if (act === "newtopic") return learnDialog(null, { newTopic: true });
  else if (act === "edit") { const n = M.learnNotes.find((x) => String(x.id) === b.dataset.id); if (n) return learnDialog(n); return; }
  else if (act === "delete") return deleteItem("learn", b.dataset.id);
  else if (act === "practice" && topic) { ln.result = null; return practiceDialog(topic); }
  else if (act === "closeresult") ln.result = null;
  render();
});
document.addEventListener("keydown", (e) => {
  if (tab !== "learn" || !M || !L || ln.mode !== 0 || !ln.tid || document.querySelector("dialog[open]") || !$("runner").classList.contains("hide")) return;
  if (/^(input|textarea|select)$/i.test(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); ln.flipped = !ln.flipped; render(); }
  else if (e.key === "ArrowRight") { ln.idx++; ln.flipped = false; render(); }
  else if (e.key === "ArrowLeft") { ln.idx = Math.max(0, ln.idx - 1); ln.flipped = false; render(); }
});

/* ---------------- Drag & drop and paste helpers (shared by Scan with AI and Questions > Import) ---------------- */
const isImgFile = (f) => !!f && (/^image\//i.test(f.type) || /\.(png|jpe?g|webp|gif|bmp|heic|heif)$/i.test(f.name || ""));
const isDocFile = (f) => !!f && (/pdf|text\/plain/i.test(f.type) || /\.(pdf|txt)$/i.test(f.name || ""));
/** Files from a drop or a paste (screenshots pasted from the clipboard arrive as image files). */
function dtFiles(dt) {
  if (!dt) return [];
  let list = [...(dt.files || [])];
  if (!list.length && dt.items) list = [...dt.items].filter((i) => i.kind === "file").map((i) => i.getAsFile());
  return list.filter(Boolean);
}
const hasFiles = (dt) => !!dt && [...(dt.types || [])].includes("Files");
/** Makes a dialog accept dropped files while `active()` is true. onFiles(File[]) gets every dropped file. */
function wireDrop(d, active, onFiles) {
  let depth = 0;
  const off = () => { depth = 0; d.classList.remove("dragover"); };
  d.addEventListener("dragenter", (e) => { if (!active() || !hasFiles(e.dataTransfer)) return; e.preventDefault(); depth++; d.classList.add("dragover"); });
  d.addEventListener("dragover", (e) => { if (!active() || !hasFiles(e.dataTransfer)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
  d.addEventListener("dragleave", () => { if (--depth <= 0) off(); });
  d.addEventListener("drop", (e) => { if (!active() || !hasFiles(e.dataTransfer)) return; e.preventDefault(); off(); onFiles(dtFiles(e.dataTransfer)); });
  d.addEventListener("close", off);
}
// A pasted screenshot / copied image goes into whichever picker is open. Pasting text is left alone.
document.addEventListener("paste", (e) => {
  const imgs = dtFiles(e.clipboardData).filter(isImgFile);
  if (!imgs.length) return;
  if (sc && sc.stage === "pick" && $("scandlg").open) { e.preventDefault(); scAddFiles(imgs); }
  else if (qi && $("dlg").open) { e.preventDefault(); qiAddFiles(imgs); }
});

function scRing() {
  const d = $("scandlg"), r = d.querySelector(".scring");
  if (!sc || !r) return;
  r.style.setProperty("--p", sc.progress);
  r.querySelector("b").textContent = sc.progress + "%";
  const sub = $("scsub"), found = $("scfound");
  if (sub) sub.textContent = sc.text;
  if (found) found.textContent = sc.found > 0 ? `${sc.found} cards found so far` : "";
}

async function startScan() {
  if (!proCan("scan")) { drawScan(); proOpen(P.limitMessage("scan")); return; }
  const key = (sc.key || "").trim();
  if (!key) { alert("Paste your Gemini API key first. You can get a free one from Google AI Studio."); return; }
  scSetKey(key);
  const mine = sc;
  sc.stage = "run"; sc.progress = 0; sc.text = "Preparing…"; sc.found = 0; sc.ctrl = new AbortController();
  drawScan();
  const known = [...learnSubjects().flatMap((x) => x.topics.flatMap((t) => t.items.map((i) => i.front))), ...M.learnNotes.map((n) => n.front)];
  try {
    const out = await S.runScan({ images: sc.images, file: sc.file, detailed: sc.detailed === 1, knownFronts: known, key, signal: sc.ctrl.signal,
      onProgress: (p, text, found) => { if (sc !== mine) return; sc.progress = p; sc.text = text; sc.found = found; scRing(); } });
    if (out.cards.length) proConsume("scan");     // a scan that made cards uses one of today's scans, like the app
    if (sc !== mine) return;
    if (!out.cards.length) { alert(out.error || "No cards could be made from these pages. Try a clearer photo."); sc.stage = "pick"; drawScan(); return; }
    sc.progress = 100; sc.text = "Done"; sc.found = out.cards.length; scRing();
    await new Promise((r) => setTimeout(r, 450));
    if (sc !== mine) return;
    sc.cards = out.cards; sc.selected = new Set(out.cards.map((c) => c.id)); sc.sid = sc.defaultSid || out.subject; sc.oneTopic = ""; sc.editing = null;
    const notes = [];
    if (out.failedBatches > 0) notes.push(`${out.failedBatches} of ${out.totalBatches} parts could not be read`);
    if (out.duplicates > 0) notes.push(`${out.duplicates} already in Learn were skipped`);
    if (out.truncated) notes.push(`only the first ${S.SCAN_MAX_PAGES} pages were used`);
    sc.notice = notes.join(" · ");
    sc.stage = "review"; drawScan();
  } catch (e) {
    if (sc !== mine) return;
    if (e.name !== "AbortError") alert(e.message || "Scan failed");
    sc.stage = "pick"; drawScan();
  }
}

async function saveScan() {
  const chosen = sc.cards.filter((c) => sc.selected.has(c.id) && c.front.trim() && c.back.trim()).map((c) => ({

  await mutateSync("learn", (arr) => { arr.push(...chosen); return arr; });
  toast(`${chosen.length} card${chosen.length === 1 ? "" : "s"} added`);

(function wireScan() {
  const d = $("scandlg");
  d.addEventListener("close", () => {
    if (sc) { if (sc.ctrl) sc.ctrl.abort(); sc.urls.forEach((u) => URL.revokeObjectURL(u)); }
    sc = null; d.innerHTML = "";
  });
  d.addEventListener("change", (e) => {
    const t = e.target;
    if (!sc || !t.dataset || !t.files) return;
    if (t.dataset.sc === "pick-img") scAddFiles([...t.files].filter(isImgFile));
    else if (t.dataset.sc === "pick-file" && t.files[0]) { sc.images = []; sc.file = t.files[0]; drawScan(); }
  });
  wireDrop(d, () => !!sc && sc.stage === "pick", scAddFiles);
  d.addEventListener("input", (e) => {
    const t = e.target;
    if (!sc) return;
    if (t.id === "sckey") sc.key = t.value;
    else if (t.id === "scone") sc.oneTopic = t.value;
    else if (t.dataset && t.dataset.scf) { const c = sc.cards.find((x) => x.id === t.dataset.id); if (c) c[t.dataset.scf] = t.value; }
  });
  d.addEventListener("click", (e) => {
    const b = e.target.closest("[data-sc]");
    if (!b || !sc || b.tagName === "INPUT") return;
    const a = b.dataset.sc, id = b.dataset.id;
    if (a === "close") return d.close();
    if (a === "cancel") { if (sc.ctrl) sc.ctrl.abort(); return; }
    if (a === "go") return startScan();
    if (a === "save") return saveScan();
    if (a === "rm-img") sc.images.splice(Number(b.dataset.i), 1);
    else if (a === "rm-file") sc.file = null;
    else if (a === "detail") sc.detailed = Number(b.dataset.i);
    else if (a === "back") sc.stage = "pick";
    else if (a === "all") sc.selected = sc.selected.size === sc.cards.length ? new Set() : new Set(sc.cards.map((c) => c.id));
    else if (a === "sid") sc.sid = id;
    else if (a === "toggle") { if (sc.selected.has(id)) sc.selected.delete(id); else sc.selected.add(id); }
    else if (a === "edit") sc.editing = sc.editing === id ? null : id;
    else return;
    drawScan();
  });
})();

/* ---------------- Trakey Pro: status, PRO badge and the free daily limits (5 AI scans, 3 AI imports) ----------------
   Same rules as the app (pro.js = TrakeyPro.kt). Pro is bought on the Trakey Pro page (pay.js, manual UPI like the app) and read from proStatus/{uid}.
   Counting: webUsage/{uid} in Firestore (follows the account) and this browser; the larger number wins.
   Everything fails open: if Firestore cannot be read, the page keeps working with what it has. */
function proWatch(user) {
  proUnsub.forEach((f) => f()); proUnsub = [];
  if (!P) return;
  proRaw = P.readCache(user.uid);
  proRemote = { scan: 0, import: 0 };
  proUnsub.push(onSnapshot(doc(db, "proStatus", user.uid), (snap) => {
    proRaw = P.fromDoc(snap.exists() ? snap.data() : null);
    P.writeCache(user.uid, proRaw);
    proRepaint();
  }, (e) => console.warn("proStatus not readable:", e.code || e.message)));
  proUnsub.push(onSnapshot(doc(db, "webUsage", user.uid), (snap) => {
    proRemote = P.usageFromDoc(snap.exists() ? snap.data() : null);
    proRepaint();
  }, (e) => console.warn("webUsage not readable:", e.code || e.message)));
}

const proIsPro = () => !!P && P.isPro(proRaw);
const proUsed = (f) => { const u = auth.currentUser; return u && P ? Math.max(P.localUsed(u.uid, f), proRemote[f] || 0) : 0; };
const proCan = (f) => !P || P.canUse(proRaw, proUsed(f), f);
const proText = (f) => P ? `${P.NOUN[f]} · ${P.limitText(proRaw, proUsed(f), f)}` : "";
const proBadge = () => proIsPro() ? P.badgeHtml(P.label(proRaw)) : "";

/** One AI use was spent (call after a scan / image import really ran). Does nothing for Pro and trial. */
async function proConsume(f) {
  const u = auth.currentUser;
  if (!u || !P || P.isPro(proRaw)) return;
  P.localBump(u.uid, f);
  proRepaint();
  try {
    await runTransaction(db, async (tx) => {
      const ref = doc(db, "webUsage", u.uid);
      const cur = P.usageFromDoc((await tx.get(ref)).data());
      cur[f] += 1;
      tx.set(ref, P.usageToDoc(cur));
    });
  } catch (e) { console.warn("webUsage not saved (this browser still counts):", e.code || e.message); }
}

async function runImport({ file, images = [], key = "", paste, target }) {
  if (!Q) { alert("qimport.js could not be loaded. Upload qimport.js and pdfread.js into the same folder as index.html."); return; }
  try {
    toast("Reading…", 0);
    let text = paste, name = "Imported", imgNote = "";
    if (images.length) {
      if (!S) throw new Error("scan.js could not be loaded. Upload scan.js and pdfread.js into the same folder as index.html.");
      name = "Imported from images";
      const r = await S.imagesToQuestionText(images, key, { onProgress: (p) => toast(`Reading images… ${p}%`, 0) });
      proConsume("import");     // reading images is the AI part; TXT, PDF and pasted text stay free and unlimited
      text = (paste.trim() ? paste.trim() + "\n" : "") + r.text;
      if (r.failed) imgNote = ` · ${r.failed} part${r.failed === 1 ? "" : "s"} of the images could not be read`;
      if (r.truncated) imgNote += ` · only the first ${S.SCAN_MAX_PAGES} images were used`;
    } else if (file) {
      name = Q.nameFromFile(file.name);
      text = /pdf/i.test(file.type) || /\.pdf$/i.test(file.name) ? await Q.pdfToText(file, (p) => toast(`Reading PDF… ${p}%`, 0)) : await file.text();
    }
    if (!text.trim()) throw new Error(images.length ? "No questions could be read from these images. Try a clearer picture." : "No readable text found. Scanned PDFs are not supported: save the pages as images and add them as images instead.");
    toast("Finding questions…", 0);
    const parsed = Q.parseQuestions(text);
    if (!parsed.items.length) throw new Error(images.length ? "No questions found in these images." : "No questions found in this file.");
    const made = parsed.items.map((it) => ({ id: newId("qq"), type: it.type, question: it.question, options: it.options, answer: it.answer,
      explanation: it.explanation || "", marks: 1, topicId: null, imported: true }));
    const skipped = parsed.leftover.filter((l) => l.length > 3).length;
    let folderId = target, fresh = made;
    if (target) {
      await mutateFolder(target, (x) => {
        const known = new Set(x.questions.map((y) => Q.normQ(y.question)));
        fresh = made.filter((y) => !known.has(Q.normQ(y.question)));
        x.questions.push(...fresh);
      });
    } else {
      folderId = newId("qtest");
      await writeItem("questions", folderId, { title: name, createdAt: Date.now(), imported: true, topics: [], questions: made });
    }
    const drafts = fresh.filter(isDraft).length;
    toast(`${fresh.length - drafts} added${drafts ? ` · ${drafts} need an answer (tap the correct option)` : ""}${skipped ? ` · ${skipped} unreadable` : ""}${imgNote}`, 6000);
    ui.qfolder = folderId; ui.q = "";
    if (tab !== "questions") location.hash = "questions"; else render();
  } catch (e) {
    toast(e.message || "Import failed", 6000);
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-q]");
  if (!b || !M || tab !== "questions") return;
  e.preventDefault();
  const a = b.dataset.q, id = b.dataset.id;
  const f = ui.qfolder ? M.folders.find((x) => x.id === ui.qfolder) : null;
  if (a === "newfolder") return folderDialog(null);
  if (a === "import") return importDialog(f);
  if (!f) return;
  if (a === "rename") return folderDialog(f);
  if (a === "add") return questionDialog(f, null);
  if (a === "newtopic") return topicDialog(f);
  const q = f.questions.find((x) => String(x.id) === String(id));
  if (a === "edit" && q) return questionDialog(f, q);
  if (a === "delete" && q) {
    if (!confirm("Delete this question? It will also be removed from the app.")) return;
    return mutateFolder(f.id, (x) => { x.questions = x.questions.filter((y) => String(y.id) !== String(id)); });
  }
  if (a === "setans" && q) {
    const opts = q.type === "TRUE_FALSE" ? ["True", "False"] : q.options;
    const ans = opts[Number(b.dataset.i)];
    if (ans === undefined) return;
    return mutateFolder(f.id, (x) => { const y = x.questions.find((z) => String(z.id) === String(id)); if (y) y.answer = ans; });
  }
  if (a === "delete-folder") {
    if (!confirm(`Delete the folder "${f.title}" and all its questions? It will also be removed from the app.`)) return;
    ui.qfolder = null;
    return mutateFolders((arr) => { const i = arr.findIndex((x) => String(x.id) === String(f.id)); if (i >= 0) arr.splice(i, 1); });
  }
});

function games() {
  const names = { memory: "Pattern Recall (level)", math: "Number Dash", seq: "Sequence Solver", path: "Path Recall (level)", digit: "Digit Recall (level)" };
  const e = Object.entries(M.game);
  return head("Trakey Game", "Your best scores") +
    `<div class="grid">${e.map(([k, v]) => `<div class="card stat"><b>${v}</b><span>${esc(names[k] || k)}</span></div>`).join("") || '<div class="empty">No game scores yet.</div>'}</div>`;
}
</script>
