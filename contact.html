<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Maniaxe Typing</title>
<meta name="description" content="Get in touch with the Maniaxe Typing team.">
<link rel="canonical" href="https://maniaxe.in/contact.html">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<header id="site-header"></header>

<main>
  <div class="page-head wrap">
    <h1>Contact us</h1>
    <p>Questions, feedback or something not working as expected — send it over and we'll get back to you.</p>
  </div>

  <div class="wrap section-tight" style="max-width:520px;">
    <div class="card">
      <form id="pageContactForm">
        <div class="field">
          <label for="cName">Name</label>
          <input type="text" id="cName" name="user_name" required>
        </div>
        <div class="field">
          <label for="cEmail">Email</label>
          <input type="email" id="cEmail" name="user_email" required>
        </div>
        <div class="field">
          <label for="cMessage">Description</label>
          <textarea id="cMessage" name="message" rows="5" required style="width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-family:inherit; font-size:.9rem; resize:vertical;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="pageContactBtn">Send message</button>
        <p class="auth-message" id="pageContactMsg"></p>
      </form>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script type="module" src="js/firebase-auth.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("pageContactForm");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const btn = document.getElementById("pageContactBtn");
      const msg = document.getElementById("pageContactMsg");
      btn.disabled = true;
      btn.textContent = "Sending...";
      msg.textContent = "";
      emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form)
        .then(function () {
          msg.style.color = "var(--correct)";
          msg.textContent = "Message sent. Thanks!";
          form.reset();
        })
        .catch(function () {
          msg.style.color = "var(--error)";
          msg.textContent = "Could not send. Please try again.";
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = "Send message";
        });
    });
  });
</script>
</body>
</html>
