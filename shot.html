<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shot — Maniaxe Typing</title>
<meta name="description" content="Turn your latest typing test result into a shareable image.">
<link rel="canonical" href="https://maniaxe.in/shot.html">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shot">

<header id="site-header"></header>

<main>
  <div class="page-head wrap">
    <h1>Shot</h1>
    <p>Turn your most recent result into a clean image you can share anywhere.</p>
  </div>

  <div class="wrap section-tight" style="display:flex; flex-direction:column; align-items:center; gap:22px;">
    <canvas id="shotCanvas" width="1200" height="630" class="shot-preview"></canvas>
    <div id="shotEmpty" class="empty-state" style="display:none;">
      <h3>No result yet</h3>
      <p>Take a test first, then come back here to turn it into a shareable image.</p>
      <a href="index.html" class="btn btn-primary" style="margin-top:16px;">Take a test</a>
    </div>
    <div id="shotActions" class="shot-actions">
      <button class="btn btn-primary" id="downloadShotBtn">Download image</button>
      <div class="result-share-wrap">
        <button class="btn btn-ghost result-share-btn" id="shareShotBtn" type="button" aria-expanded="false" aria-haspopup="menu">
          <span aria-hidden="true">↗</span> Share
        </button>
        <div class="result-share-menu" id="shareShotMenu" role="menu">
          <div class="result-share-title">Share result</div>
          <button type="button" class="result-share-option" id="shareShotLinkBtn" role="menuitem">Share image + website link</button>
          <button type="button" class="result-share-option" id="shareShotImageBtn" role="menuitem">Share image only</button>
        </div>
      </div>
      <a href="index.html" class="btn btn-ghost">Take another test</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script type="module" src="js/firebase-auth.js"></script>
<script src="js/history.js"></script>
<script src="js/app.js"></script>
<script src="js/shot-utils.js"></script>
<script src="js/shot.js"></script>
</body>
</html>
